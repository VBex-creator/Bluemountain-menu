<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Mountain - Menu</title>
    <meta name="description" content="Digital menu for Blue Mountain specialty coffee, food and drink.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Landing Overlay for Language Selection -->
    <div id="landing-overlay" class="landing-overlay">
        <div class="landing-content">
            <img src="logo.jpg" alt="Blue Mountain Logo" class="logo landing-logo">
            <h2 class="welcome-text">Welcome / Καλώς ήρθατε</h2>
            <p class="select-lang-text">Please select your language:</p>
            <div class="flag-buttons">
                <button id="btn-en" class="lang-btn">
                    <span class="flag">🇬🇧</span> English
                </button>
                <button id="btn-el" class="lang-btn">
                    <span class="flag">🇬🇷</span> Ελληνικά
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content (Hidden initially) -->
    <div id="main-content" class="hidden">
        
        <header class="hero">
            <div class="hero-content">
                <img src="logo.jpg" alt="Blue Mountain Logo" class="logo">
            </div>
        </header>

        <nav class="category-nav" id="category-nav">
            <ul class="nav-list" id="nav-list-container">
                <!-- Dynamically generated by script.js -->
            </ul>
        </nav>

        <main class="menu-container" id="menu-container">
            <!-- Dynamically generated by script.js -->
        </main>

        <footer>
            <p>Thank you for visiting Blue Mountain</p>
            <p class="footer-small">Scan QR to share our menu</p>
        </footer>

        <!-- Floating Change Language Button -->
        <button id="btn-change-lang" class="floating-lang-btn" aria-label="Change Language">
            🌍
        </button>

    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
